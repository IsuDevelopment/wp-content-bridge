name: Build & Release

# Cutting a release is a deliberate act: push a tag, or dispatch manually.
#
# This workflow previously also fired on any push to main that touched
# wp-content-bridge.php, deriving the tag from the version header. On
# 2026-08-07 that published a v0.4.0 built from the rename commit alone,
# missing the entire Slice 1A feature set, because the follow-up commit did not
# touch the version line. It also auto-published a v0.3.1 nobody asked for.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and release plugin
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version from plugin header
        id: version
        run: |
          VERSION=$(grep -m1 'Version:' wp-content-bridge.php | awk '{print $NF}' | tr -d '[:space:]')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      # A tag that disagrees with the plugin header would publish the artifact
      # under a version it does not contain.
      - name: Assert the pushed tag matches the plugin header
        if: github.ref_type == 'tag'
        run: |
          if [ "${{ github.ref_name }}" != "${{ steps.version.outputs.tag }}" ]; then
            echo "Tag ${{ github.ref_name }} does not match plugin header version ${{ steps.version.outputs.version }}."
            exit 1
          fi

      - name: Check if tag already exists
        id: tag_check
        run: |
          if git rev-parse "refs/tags/v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create and push tag
        if: steps.tag_check.outputs.exists == 'false' && github.ref_type == 'branch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2

      - name: Install Composer dependencies
        run: composer install --no-dev --optimize-autoloader

      # Ship the plugin, nothing else. Development files previously reached
      # every install: 74 files under docs/ and .agents/ were in the v0.4.0
      # artifact, including the security model, known gaps, and notes about a
      # consuming site's grants.
      - name: Build plugin zip
        run: |
          mkdir -p build/wp-content-bridge
          # Leading slash anchors a pattern to the repository root. Without it
          # rsync matches at every depth, which would strip composer.json out
          # of every package under vendor/ as well.
          rsync -a --exclude-from=- ./ build/wp-content-bridge/ <<'EOF'
          .git
          node_modules
          *.zip
          /.github
          /.gitignore
          /.agents
          /.claude
          /.superpowers
          /.continue-here.md
          /.uer-notes.md
          /.phpunit.cache
          /.editorconfig
          /build
          /tests
          /stubs
          /docs
          /*.dist
          /AGENTS.md
          /CLAUDE.md
          /CODEX.md
          /GEMINI.md
          /composer.json
          /composer.lock
          /wp-content-bridge.code-workspace
          EOF
          cd build && zip -r ../wp-content-bridge.zip wp-content-bridge

      # Fail the release rather than publish a leaking artifact.
      - name: Assert no development files in the artifact
        run: |
          LEAKED=$(unzip -l wp-content-bridge.zip \
            | grep -E 'wp-content-bridge/(docs|tests|stubs|\.agents|\.claude|\.superpowers)/|wp-content-bridge/(AGENTS|CLAUDE|CODEX|GEMINI)\.md$|wp-content-bridge/\.(uer-notes|continue-here)\.md$|wp-content-bridge/composer\.(json|lock)$' \
            || true)
          if [ -n "$LEAKED" ]; then
            echo "Development files leaked into the release artifact:"
            echo "$LEAKED"
            exit 1
          fi
          test -f build/wp-content-bridge/wp-content-bridge.php
          test -f build/wp-content-bridge/readme.txt
          test -f build/wp-content-bridge/vendor/autoload.php
          echo "Artifact contents OK"

      # v0.8.4, v0.9.0 and v0.10.0 published with a body containing nothing but
      # the compare link, because `generate_release_notes` alone produces the
      # commit list and no notes. The changelog a human wrote already exists in
      # readme.txt; this lifts that section into the release body so the two
      # cannot drift, and fails when the section is missing - a release with no
      # changelog entry is a defect, not something to publish quietly.
      - name: Extract this version's changelog from readme.txt
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          awk -v v="= $VERSION =" '
            $0 == v { found = 1; next }
            found && /^= [0-9]+\.[0-9]+/ { exit }
            found { print }
          ' readme.txt > changelog-section.md
          if [ ! -s changelog-section.md ]; then
            echo "readme.txt has no changelog section for $VERSION."
            exit 1
          fi
          {
            echo "## Changelog"
            echo
            sed 's/^\* /- /' changelog-section.md
            echo
            echo "---"
            echo
            echo "**Install:** download \`wp-content-bridge.zip\` below and install it as a plugin, or let the built-in updater offer it."
          } > release-body.md
          echo "Release body:"
          cat release-body.md

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          files: wp-content-bridge.zip
          body_path: release-body.md
          generate_release_notes: true
